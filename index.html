<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>七夕心愿礼 · 橘朵礼物挑选页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 小猪装饰层（全局） -->
  <div class="pig-decor" aria-hidden="true">
    <img class="pig pig-1" src="images/pigs/pig-full.png" alt="">
    <img class="pig pig-2" src="images/pigs/pig-courier.png" alt="">
    <img class="pig pig-3" src="images/pigs/pig-face.png" alt="">
    <img class="pig-ear pig-ear-1" src="images/pigs/pig-ear.png" alt="">
    <img class="pig-ear pig-ear-2" src="images/pigs/pig-ear.png" alt="">
    <img class="pig-tail pig-tail-1" src="images/pigs/pig-tail.png" alt="">
    <img class="pig-foot pig-foot-1" src="images/pigs/pig-foot.png" alt="">
    <img class="pig-foot pig-foot-2" src="images/pigs/pig-foot.png" alt="">
  </div>

  <!-- ============ 前置互动舞台 ============ -->
  <section class="stage intro-stage" id="introStage">
    <!-- 第一屏：开场 -->
    <div class="screen screen-start active" id="screenStart">
      <h1 class="intro-q">你知道今天是什么日子吗！</h1>
      <div class="intro-options">
        <button class="intro-btn" id="optRight" data-correct="1">七夕</button>
        <button class="intro-btn intro-btn-flee" id="optFlee">2026年8月18日</button>
      </div>
      <p class="intro-hint">（提示：点对的那个就行～）</p>
    </div>

    <!-- 第二屏：答错/天数 -->
    <div class="screen screen-days" id="screenDays">
      <h1 class="intro-q">答错了！</h1>
      <p class="intro-line">明明是在一起的第 天</p>
      <div class="days-wrap">
        <div class="day-slots" id="daySlots">
          <div class="day-slot" data-idx="0"></div>
          <div class="day-slot" data-idx="1"></div>
          <div class="day-slot" data-idx="2"></div>
        </div>
        <div class="days-numpad" id="daysNumpad"></div>
      </div>
      <button class="intro-btn intro-btn-go" id="daysConfirm" disabled>确认</button>
    </div>

    <!-- 第三屏：奖励 -->
    <div class="screen screen-reward" id="screenReward">
      <h1 class="intro-q">你也太聪明了！</h1>
      <p class="intro-line">奖励你小礼物！</p>
      <div class="intro-options">
        <button class="intro-btn intro-btn-flee" id="optNo">不用了</button>
        <button class="intro-btn intro-btn-go" id="optYes">好耶！我要！</button>
      </div>
    </div>
  </section>

  <!-- ============ 礼物挑选舞台 ============ -->
  <section class="stage gift-stage" id="giftStage" hidden>
    <div class="bg-decor" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>
    </div>

    <header class="hero">
      <p class="hero-kicker"><span class="heart">♡</span> 七夕限定 · 心愿清单 <span class="heart">♡</span></p>
      <h1 class="hero-title">
        我们逛了逛多次，<br class="mobile-only">“想买”说了好多遍……<br>
        <span class="hero-accent">现在不用看价格啦！</span>
      </h1>
      <p class="hero-sub">点亮 <b>♡</b> 挑出最想要的礼物，选好型号就好啦～</p>
    </header>

    <main class="catalog">
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="searchInput" type="search" placeholder="搜索想要的心愿礼物…" autocomplete="off">
        </div>
        <div class="chips" id="categoryChips"></div>
      </div>
      <div class="grid" id="productGrid"></div>
      <div class="empty" id="emptyTip" hidden>没有找到对应的宝贝，换个关键词试试～</div>
    </main>

    <footer class="footer">
      <p>挑好心愿，点「确认心愿」就好啦～</p>
      <p class="footer-sub">JUDYDOLL 橘朵 · 七夕心愿礼</p>
    </footer>

    <!-- 商品详情 / 选择型号 -->
    <div class="modal-mask" id="modalMask" hidden>
      <div class="modal modal-detail" role="dialog" aria-modal="true" aria-labelledby="modalName">
        <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
        <div class="modal-image-wrap"><img id="modalImage" class="modal-image" alt=""></div>
        <div class="modal-body">
          <h2 id="modalName"></h2>
          <div class="modal-price">￥<span id="modalPrice">0.00</span>元</div>
          <label class="field-label" for="modelSelect">选择型号</label>
          <select id="modelSelect" class="model-select"></select>
          <button class="btn-primary" id="addBtn">加入心愿单</button>
          <p class="modal-tip">已选 <span id="modalCount">0</span> 件</p>
        </div>
      </div>
    </div>

    <!-- 提交确认 -->
    <div class="modal-mask" id="confirmMask" hidden>
      <div class="modal modal-confirm" role="dialog" aria-modal="true">
        <button class="modal-close" id="confirmClose" aria-label="关闭">✕</button>
        <h2 class="confirm-title">我的心愿清单</h2>
        <p class="confirm-sub">挑好的 <b id="confirmCount">0</b> 件礼物：</p>
        <ul class="confirm-list" id="confirmList"></ul>
        <div class="confirm-actions">
          <button class="btn-primary btn-confirm-wish" id="sendBtn">确认心愿</button>
        </div>
      </div>
    </div>

    <!-- 底部心愿栏 -->
    <div class="wish-bar" id="wishBar" hidden>
      <div class="wish-bar-inner">
        <div class="wish-count"><b id="wishCount">0</b><span class="wish-total"> / 3</span></div>
        <div class="wish-tags" id="wishTags"></div>
        <button class="btn-submit" id="submitBtn" disabled>提交心愿清单</button>
      </div>
    </div>
  </section>

  <!-- 提交成功全屏页 -->
  <section class="success-stage" id="successStage" hidden>
    <div class="success-bg" aria-hidden="true"></div>
    <canvas class="confetti" id="confettiCanvas" aria-hidden="true"></canvas>
    <div class="success-content">
      <img class="success-pig" src="images/pigs/pig-courier.png" alt="">
      <h1 class="success-title">许愿成功</h1>
      <p class="success-sub">礼物即将由猪猪快递配送</p>
      <p class="success-meta">已收到你的心愿清单，正在精心打包中 ♡</p>
      <button class="success-close" id="successClose">收下这份甜蜜</button>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
